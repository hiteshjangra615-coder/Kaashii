@keyframes drift{50%{transform:translateY(-12px) rotate(8deg)}}@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.035)}100%{transform:scale(1)}}@keyframes breathe{0%,100%{transform:scale(.9);opacity:.78}50%{transform:scale(1.12);opacity:1}}

.mood-grid,.gift-grid,.smile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:10px 0 15px}.choice,.gift{background:#fffafc;border:1px solid var(--line);border-radius:20px;padding:17px 13px;text-align:left;color:var(--ink);min-height:100px;transition:transform .18s,border-color .18s,background .18s}.choice:hover,.gift:hover{transform:translateY(-2px);border-color:#d8b5db;background:#fff}.choice .emoji,.gift .emoji{display:block;font-size:27px;margin-bottom:8px}.choice strong,.gift strong{display:block;font-size:14px;margin-bottom:4px}.choice small,.gift small{color:var(--muted);font-size:12px}.message{display:none;background:#fff7fc;border:1px solid #f0d9e7;padding:17px;border-radius:18px;line-height:1.8;color:#6c5977;margin:12px 0;animation:pop .25s ease}.message.show{display:block}.gift{min-height:120px;text-align:center}.gift.opened{background:#fff0f7;border-color:#e4b4ce}.gift.opened .emoji{animation:pop .3s ease}.breath-wrap{text-align:center;padding:12px 0}.breath-orb{width:118px;height:118px;border-radius:50%;margin:12px auto 18px;background:radial-gradient(circle at 35% 30%,#fff,#edc7e5 65%,#cbbdf6);box-shadow:0 0 0 13px #f8e7f2aa;display:grid;place-items:center;animation:breathe 5s ease-in-out infinite}.breath-orb span{font-size:30px}.tiny{font-size:12px;color:#9a8ba2}.thoughts{width:100%;min-height:140px;resize:vertical;border:1px solid var(--line);background:#fffdfd;border-radius:18px;padding:15px;color:var(--ink);line-height:1.65}.privacy{font-size:12px;background:#f7f2ff;padding:12px 14px;border-radius:14px;margin:10px 0 15px;color:#766888;line-height:1.6}.final-heart{font-size:54px;margin:3px 0 17px;animation:pop .5s ease}.letter-controls{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}.letter-content{display:none}.letter-content.open{display:block}.letter-paragraph{margin:0 0 16px;line-height:1.85;color:#51435f}.letter-final{padding:16px 18px;border:1px solid #d8c5f5;background:linear-gradient(135deg,#f6efffdd,#fff /* Elegant cursive headings across all 8 chapters; keep layout and interactions unchanged */
h1,h2{font-family:'Allura','Segoe Script','Brush Script MT',cursive;font-weight:400;letter-spacing:0;line-height:1.12;overflow-wrap:anywhere;}
h1{font-size:clamp(36px,8vw,46px);margin-bottom:18px;}

@media(max-width:380px){h1{font-size:36px}h2{font-size:33px;}}

/* ==========================================================
   CLEAR GLASS CARD — stars, clouds & sparkles visible THROUGH the card
   (CSS only. Keep this block LAST in <style> so it wins.)
   Tweak the 3 knobs below:
   --glass-tint  : higher = more milky/purple, lower = more see-through
   --glass-blur  : 0px = crystal clear, 3px = very light frost
   --glass-glow  : edge glow strength
   ========================================================== */
:root{
  --glass-tint:.31;
  --glass-blur:2px;
  --glass-glow:.42;
}
.panel{
  background:
    linear-gradient(135deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.02) 38%,rgba(255,255,255,0) 60%,rgba(190,140,255,.08) 100%),
    rgba(52,24,125,var(--glass-tint));
  border:1px solid rgba(214,182,255,.62);
  box-shadow:
    0 0 0 1px rgba(170,120,255,.14),
    0 0 26px rgba(168,112,255,var(--glass-glow)),
    0 14px 40px rgba(20,4,56,.22),
    inset 0 0 34px rgba(190,150,255,.14),
    inset 0 1px 0 rgba(255,255,255,.38),
    inset 0 -1px 0 rgba(255,255,255,.10);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(125%) brightness(.9);
  backdrop-filter:blur(var(--glass-blur)) saturate(125%) brightness(.9);
}
.panel:before{
  background:linear-gradient(160deg,rgba(255,255,255,.12),transparent 30%,transparent 70%,rgba(200,150,255,.08));
}
/* inner boxes: also see-through glass */
.soft-note,.message,.privacy{
  background:rgba(170,130,245,.17);
  border:1px solid rgba(232,208,255,.52);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 18px rgba(200,160,255,.10),0 0 14px rgba(170,120,255,.14);
  -webkit-backdrop-filter:blur(1.5px) saturate(125%);
  backdrop-filter:blur(1.5px) saturate(125%);
}
.choice,.gift{
  background:rgba(170,130,245,.14);
  border:1px solid rgba(228,200,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 14px rgba(200,160,255,.08);
  -webkit-backdrop-filter:blur(1.5px);
  backdrop-filter:blur(1.5px);
}
.choice:hover,.gift:hover{background:rgba(255,255,255,.14);border-color:rgba(255,220,255,.85)}
.gift.opened{background:rgba(245,130,205,.20)}
.thoughts{
  background:rgba(25,8,60,.22);
  border:1px solid rgba(232,208,255,.6);
  -webkit-backdrop-filter:blur(1.5px);
  backdrop-filter:blur(1.5px);
}
.letter-final{
  background:linear-gradient(135deg,rgba(200,165,255,.16),rgba(255,160,222,.10));
  -webkit-backdrop-filter:blur(1.5px);
  backdrop-filter:blur(1.5px);
}
/* buttons: glassy, pink Next stays vivid */
.btn.secondary{
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(150,110,230,.20));
  border:1px solid rgba(232,208,255,.72);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 16px rgba(60,20,120,.22);
  -webkit-backdrop-filter:blur(2px);
  backdrop-filter:blur(2px);
}
.counter{
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(140,100,230,.22));
  -webkit-backdrop-filter:blur(2px);
  backdrop-filter:blur(2px);
}
/* text must stay readable on a clear card: soft dark halo behind letters */
.panel p,.panel .letter-paragraph,.panel .soft-note,.panel .message,.panel small,.panel strong{
  color:#fff;
  font-weight:500;
  text-shadow:0 1px 2px rgba(14,3,42,.95),0 0 10px rgba(14,3,42,.75),0 0 22px rgba(14,3,42,.45);
}
.panel strong{font-weight:800}
.panel small{color:#f2e6ff}
.panel h1,.panel h2{
  -webkit-text-stroke:.6px currentColor;
  text-shadow:0 1px 3px rgba(30,6,66,.95),0 0 14px rgba(30,6,66,.8),0 0 26px rgba(30,6,66,.5);
}
.panel .eyebrow{text-shadow:0 1px 3px rgba(30,6,66,.95),0 0 12px rgba(30,6,66,.7),0 0 10px #ff75d755}
/* floating hearts & sparkles: a bit brighter so they are noticed */
.floaties{opacity:.95}
.floaties span{text-shadow:0 0 12px rgba(255,190,240,.9),0 0 22px rgba(190,140,255,.7)}
/* keep the same on phones (older mobile rule used blur 7px) */
@media(max-width:480px){
  .panel{
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(125%) brightness(.9);
    backdrop-filter:blur(var(--glass-blur)) saturate(125%) brightness(.9);
  }
}

/* ==========================================================
   BACKGROUND EFFECTS ONLY — twinkling sparkles + falling petals
   They sit BEHIND the card (z-index 0), so you see them through the glass.
   Nothing else on the page is changed by this block.
   ========================================================== */
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petal{position:absolute;top:-6vh;left:var(--x);width:var(--w);height:calc(var(--w)*1.35);border-radius:85% 0 85% 0;background:linear-gradient(135deg,#ffd6ec,#e983cc);opacity:.8;box-shadow:0 0 8px rgba(255,170,230,.55);animation:petalFall var(--d) linear infinite;animation-delay:var(--dl);will-change:transform}
@keyframes petalFall{0%{transform:translate3d(0,0,0) rotate(0deg)}50%{transform:translate3d(calc(var(--dx)*.5),56vh,0) rotate(230deg)}100%{transform:translate3d(var(--dx),112vh,0) rotate(480deg)}}
.glint{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);filter:drop-shadow(0 0 5px rgba(255,205,255,.95));animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--dl)}
.glint i{display:block;width:100%;height:100%;background:linear-gradient(135deg,#fff,#ffd9ff);clip-path:polygon(50% 0,59% 41%,100% 50%,59% 59%,50% 100%,41% 59%,0 50%,41% 41%)}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.55) rotate(0deg)}50%{opacity:1;transform:scale(1.1) rotate(12deg)}}
@media(prefers-reduced-motion:reduce){.fx{display:none}}

/* ==========================================================
   FEATURE 1 — PAGE-TURN ANIMATION (slide + glass shimmer + soft cascade)
   ========================================================== */
.panel{animation:none}
.panel.turn-next{animation:turnNext .55s cubic-bezier(.2,.8,.2,1) both}
.panel.turn-prev{animation:turnPrev .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes turnNext{from{opacity:0;transform:translateX(38px) scale(.985)}to{opacity:1;transform:none}}
@keyframes turnPrev{from{opacity:0;transform:translateX(-38px) scale(.985)}to{opacity:1;transform:none}}
.panel::after{content:"";position:absolute;top:-10%;bottom:-10%;left:-60%;width:42%;pointer-events:none;opacity:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.26),rgba(255,210,255,.14),transparent);transform:skewX(-18deg)}
.panel.turn-next::after,.panel.turn-prev::after{animation:glassShimmer 1s ease-out .05s both}
@keyframes glassShimmer{0%{left:-60%;opacity:0}15%{opacity:1}100%{left:125%;opacity:0}}
.panel.turn-next>*:not(.final-heart):not(.message),.panel.turn-prev>*:not(.final-heart):not(.message){animation:kidIn .6s cubic-bezier(.2,.8,.2,1) both}
.panel.turn-next>*:nth-child(2),.panel.turn-prev>*:nth-child(2){animation-delay:.06s}
.panel.turn-next>*:nth-child(3),.panel.turn-prev>*:nth-child(3){animation-delay:.12s}
.panel.turn-next>*:nth-child(4),.panel.turn-prev>*:nth-child(4){animation-delay:.18s}
.panel.turn-next>*:nth-child(5),.panel.turn-prev>*:nth-child(5){animation-delay:.24s}
.panel.turn-next>*:nth-child(6),.panel.turn-prev>*:nth-child(6){animation-delay:.3s}
.panel.turn-next>*:nth-child(n+7),.panel.turn-prev>*:nth-child(n+7){animation-delay:.36s}
@keyframes kidIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ==========================================================
   FEATURE 4 — MOOD-REACTIVE BACKGROUND (chapter 3: tap a mood)
   ========================================================== */
.mood-fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;opacity:0;transition:opacity .8s ease}
.mood-fx.on{opacity:1}
.mood-fx.mood-top{z-index:2}
.mood-fx::before{content:"";position:absolute;inset:0}
.mood-heavy::before{background:linear-gradient(180deg,rgba(30,50,130,.30),rgba(20,30,90,.18))}
.mood-tired::before{background:radial-gradient(120% 70% at 50% 105%,rgba(255,176,140,.22),transparent 60%),rgba(15,8,50,.26)}
.mood-alone::before{background:radial-gradient(60% 40% at 82% 8%,rgba(205,220,255,.26),transparent 70%)}
.mood-happy::before{background:radial-gradient(90% 60% at 50% 100%,rgba(255,140,200,.22),transparent 65%)}
.mood-fx .drop{position:absolute;top:-8vh;width:1.5px;height:20px;background:linear-gradient(to bottom,transparent,rgba(196,214,255,.95));animation:rain linear infinite}
@keyframes rain{to{transform:translateY(115vh)}}
.mood-fx .zzz{position:absolute;bottom:-6vh;font-style:normal;font-weight:700;color:rgba(232,216,255,.85);text-shadow:0 0 12px rgba(190,150,255,.85);animation:zRise linear infinite}
@keyframes zRise{0%{transform:translate(0,0) rotate(-8deg);opacity:0}15%{opacity:.9}100%{transform:translate(26px,-108vh) rotate(10deg);opacity:0}}
.mood-fx .moon{position:absolute;right:8%;top:86px;font-size:40px;filter:drop-shadow(0 0 14px rgba(255,240,200,.9)) drop-shadow(0 0 30px rgba(190,170,255,.7));animation:moonGlow 4s ease-in-out infinite alternate}
@keyframes moonGlow{from{transform:scale(.95);opacity:.85}to{transform:scale(1.07);opacity:1}}
.mood-fx .shoot{position:absolute;left:100%;width:120px;height:2px;border-radius:2px;background:linear-gradient(90deg,#fff,rgba(255,255,255,0));transform-origin:left center;opacity:0;animation:shootAcross linear infinite}
@keyframes shootAcross{0%{transform:translate(0,0) rotate(-32deg);opacity:0}3%{opacity:1}20%{transform:translate(-115vw,70vw) rotate(-32deg);opacity:0}100%{transform:translate(-115vw,70vw) rotate(-32deg);opacity:0}}
.mood-fx .fl{position:absolute;bottom:-8vh;font-style:normal;filter:drop-shadow(0 0 6px rgba(255,170,220,.6));animation:flRise linear infinite}
@keyframes flRise{0%{transform:translate(0,0) rotate(-10deg) scale(.8);opacity:0}12%{opacity:.95}50%{transform:translate(18px,-55vh) rotate(8deg) scale(1)}100%{transform:translate(-14px,-112vh) rotate(-8deg) scale(1.05);opacity:0}}
@media(prefers-reduced-motion:reduce){.mood-fx{display:none}}

/* ==========================================================
   FEATURE 5 — TAP SPARKLES (anywhere you tap)
   ========================================================== */

function heartOfStars(){
 const box=document.createElement('div');box.className='heartfx';document.body.appendChild(box);
 const unit=Math.min(innerWidth,innerHeight)*0.021,N=40,vw=innerWidth,vh=innerHeight;
 for(let i=0;i<N;i++){
  const t=i/N*Math.PI*2;
  const ex=16*Math.pow(Math.sin(t),3)*unit, ey=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*unit;
  const sx=(Math.random()-.5)*vw*1.3, sy=(Math.random()-.5)*vh*1.1, size=8+Math.random()*9;
  const el=document.createElement('i');el.className='hstar';el.style.width=el.style.height=size+'px';el.style.margin=(-size/2)+'px 0 0 '+(-size/2)+'px';
  box.appendChild(el);
  el.animate([{transform:`translate(${sx}px,${sy}px) scale(.3) rotate(0deg)`,opacity:0},{transform:`translate(${ex}px,${ey}px) scale(1) rotate(90deg)`,opacity:1}],{duration:1700,delay:i*40,easing:'cubic-bezier(.22,1,.36,1)',fill:'forwards'});
 }
 endTimers.push(setTimeout(()=>{box.animate([{transform:'scale(1)'},{transform:'scale(1.07)'},{transform:'scale(1)'}],{duration:1400,easing:'ease-in-out'});},3300));
 endTimers.push(setTimeout(()=>{const a=box.animate([{opacity:1},{opacity:0}],{duration:1400,fill:'forwards'});a.onfinish=()=>box.remove();},5200));
 endTimers.push(setTimeout(()=>box.remove(),7000));
}
function revealEl(id){const el=document.getElementById(id);if(!el)return;el.hidden=false;el.classList.add('reveal');if(!matchMedia('(prefers-reduced-motion: reduce)').matches)el.scrollIntoView({behavior:'smooth',block:'center'});}
function endingSequence(){
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduce){['letterPromise','letterSign','letterWish'].forEach(id=>{const e=document.getElementById(id);if(e)e.hidden=false;});return;}
 const at=(ms,fn)=>endTimers.push(setTimeout(()=>{if(document.getElementById('letterContent'))fn();},ms));
 at(300,()=>sprinkle(['✦','✧','💜','✨']));
 at(1200,()=>revealEl('letterPromise'));
 at(3200,()=>revealEl('letterSign'));
 at(5000,heartOfStars);
 at(9200,()=>{const st=document.createElement('div');st.className='shoot-open';document.body.appendChild(st);setTimeout(()=>st.remove(),2000);});
 at(9900,()=>revealEl('letterWish'));
}
function finishLetter(){
 clearLetterTimer();
 const holder=document.getElementById('letterParagraphs');
 const finalLine=document.getElementById('letterFinal');
 if(!holder||!finalLine)return;
 holder.innerHTML='';
 letterParagraphs.forEach((text,i)=>{const p=document.createElement('p');p.className='letter-paragraph';p.textContent=text;holder.appendChild(p);});
 finalLine.hidden=false;letterComplete=true;
 const skip=document.querySelector('[data-action="skipLetter"]');if(skip)skip.hidden=true;
 endingSequence();
}
function startLetter(){
 if(letterStarted||letterComplete)return;
 letterStarted=true;
 const content=document.getElementById('letterContent');
 const holder=document.getElementById('letterParagraphs');
 const open=document.querySelector('[data-action="openLetter"]');
 const skip=document.querySelector('[data-action="skipLetter"]');
 if(!content||!holder)return;
 content.classList.add('open');if(open)open.disabled=true;if(skip)skip.hidden=false;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){finishLetter();return;}
 let paragraphIndex=0;
 function typeParagraph(){
  if(!document.getElementById('letterContent')){clearLetterTimer();return;}
  if(paragraphIndex>=letterParagraphs.length){
   const finalLine=document.getElementById('letterFinal');if(finalLine)finalLine.hidden=false;
   letterComplete=true;if(skip)skip.hidden=true;endingSequence();return;
  }
  const p=document.createElement('p');p.className='letter-paragraph';holder.appendChild(p);
  const text=letterParagraphs[paragraphIndex];let charIndex=0;
  function typeChar(){
   if(!document.getElementById('letterContent')){clearLetterTimer();return;}
   if(charIndex<text.length){p.textContent+=text.charAt(charIndex++);letterTimer=setTimeout(typeChar,9);}
   else {paragraphIndex++;letterTimer=setTimeout(typeParagraph,420);}
  }
  typeChar();
 }
 typeParagraph();
}
/* ---- page-turn animation (feature 1) ---- */
let turnTimer=null;
function playTurn(dir){
 panel.classList.remove('turn-next','turn-prev');void panel.offsetWidth;
 panel.classList.add(dir==='prev'?'turn-prev':'turn-next');
 clearTimeout(turnTimer);turnTimer=setTimeout(()=>panel.classList.remove('turn-next','turn-prev'),1100);
}
/* ---- mood-reactive background (feature 4) ---- */
const moodfx=document.getElementById('moodfx'), moodtop=document.getElementById('moodtop');
function clearMoodFx(){[moodfx,moodtop].forEach(el=>{if(el){el.className=el.id==='moodtop'?'mood-fx mood-top':'mood-fx';el.innerHTML='';}});}
function setMoodFx(kind){
 if(!moodfx||!moodtop)return;
 clearMoodFx();
 const R=(a,b)=>a+Math.random()*(b-a);let h='';
 if(kind==='heavy'){
  for(let i=0;i<36;i++)h+=`<i class="drop" style="left:${R(0,100).toFixed(1)}%;animation-duration:${R(.8,1.5).toFixed(2)}s;animation-delay:${(-R(0,1.5)).toFixed(2)}s;opacity:${R(.35,.85).toFixed(2)}"></i>`;
 }else if(kind==='tired'){
  for(let i=0;i<9;i++)h+=`<b class="zzz" style="left:${R(5,90).toFixed(1)}%;font-size:${R(15,28).toFixed(0)}px;animation-duration:${R(9,15).toFixed(1)}s;animation-delay:${(-R(0,12)).toFixed(1)}s">${i%3===0?'Z':'z'}</b>`;
 }else if(kind==='alone'){
  h+='<span class="moon">🌙</span>';
  for(let i=0;i<3;i++)h+=`<s class="shoot" style="top:${R(3,38).toFixed(0)}%;animation-duration:${R(5,8).toFixed(1)}s;animation-delay:${(-R(0,6)).toFixed(1)}s"></s>`;
 }else if(kind==='happy'){
  const e=['🍓','🌸','🐣','🧁','💗','✨'];
  for(let i=0;i<14;i++)h+=`<em class="fl" style="left:${R(4,92).toFixed(1)}%;font-size:${R(18,30).toFixed(0)}px;animation-duration:${R(8,14).toFixed(1)}s;animation-delay:${(-R(0,12)).toFixed(1)}s">${e[i%e.length]}</em>`;
 }
 moodtop.innerHTML=h;
 requestAnimationFrame(()=>{moodfx.classList.add('on','mood-'+kind);moodtop.classList.add('on');});
}
function render(){
 clearLetterTimer();letterStarted=false;letterComplete=false;clearMoodFx();
 const c=chapters[index]; panel.innerHTML=c.render(); panel.setAttribute('aria-label',c.label);
 /* every chapter gets the sparkle button (chapters 1, 6 and 8 already have their own) */
 if(!panel.querySelector('[data-action="sparkle"]')){
  let row=panel.querySelector('.actions');
  const hasOthers=!!row;
  if(!row){row=document.createElement('div');row.className='actions';panel.appendChild(row);}
  row.insertAdjacentHTML('beforeend','<button class="btn'+(hasOthers?' secondary':'')+'" data-action="sparkle">A little sparkle ✨</button>');
 }
 counter.textContent=`Chapter ${index+1} of ${chapters.length}`;bar.style.width=((index+1)/chapters.length*100)+'%';progress.setAttribute('aria-valuenow',index+1);
 prev.disabled=index===0;next.textContent=index===chapters.length-1?'Back to start ↻':'Next →';
}
let busy=false;
function go(n){
 if(busy)return;
 const target=Math.max(0,Math.min(chapters.length-1,n));
 if(target===index&&n!==0)return;
 const dir=target>=index?'next':'prev';
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const swap=()=>{
  const h0=panel.offsetHeight;
  index=target;render();
  panel.style.transition='none';panel.style.height='auto';
  const h1=panel.offsetHeight;
  playTurn(dir);
  if(!reduce&&Math.abs(h1-h0)>2){
   panel.style.height=h0+'px';void panel.offsetHeight;
   panel.style.transition='height .55s cubic-bezier(.22,1,.36,1)';
   panel.style.height=h1+'px';
   setTimeout(()=>{panel.style.transition='';panel.style.height='';busy=false;},580);
  }else{panel.style.transition='';panel.style.height='';setTimeout(()=>{busy=false;},reduce?0:350);}
  window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
 };
 if(reduce){busy=true;swap();return;}
 busy=true;
 clearTimeout(turnTimer);
 panel.classList.remove('turn-next','turn-prev');
 panel.classList.add(dir==='next'?'leave-next':'leave-prev');
 setTimeout(()=>{panel.classList.remove('leave-next','leave-prev');swap();},260);
}
prev.addEventListener('click',()=>go(index-1));next.addEventListener('click',()=>go(index===chapters.length-1?0:index+1));
panel.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.mood){const el=document.getElementById('moodMessage');el.textContent=moodText[b.dataset.mood];el.classList.add('show');setMoodFx(b.dataset.mood);return;}
 if(b.dataset.gift!==undefined){const n=Number(b.dataset.gift), el=document.getElementById('giftMessage');el.textContent=gifts[n];el.classList.add('show');b.classList.add('opened');b.querySelector('small').textContent='opened with care 💗';sprinkle(['💗','✨','🌷']);return;}
 if(b.dataset.action==='openLetter'){startLetter();return;}
  if(b.dataset.action==='skipLetter'){finishLetter();return;}
  if(b.dataset.action==='random'){let line=lines[Math.floor(Math.random()*lines.length)];const el=document.getElementById('randomLine');if(lines.length>1&&el.textContent===line)line=lines[(lines.indexOf(line)+1)%lines.length];el.textContent=line;el.animate?.([{opacity:.3,transform:'translateY(4px)'},{opacity:1,transform:'none'}],{duration:220});}
 if(b.dataset.action==='sparkle')sprinkle(['💗','✨','🌸','♡']);
 if(b.dataset.action==='clearThoughts'){document.getElementById('thoughts').value='';const m=document.getElementById('thoughtMessage');m.textContent='Text clear ho gaya. 🌷';m.classList.add('show');}
 if(b.dataset.action==='saveNotice'){const m=document.getElementById('thoughtMessage');m.textContent='Yeh text isi page par tab tak rahega jab tak aap page refresh ya close nahi karti. Kahin send ya permanently save nahi hota. 🤍';m.classList.add('show');}
 if(b.dataset.action==='restart')go(0);
});
function sprinkle(chars){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<12;i++){const s=document.createElement('span');s.className='sprinkle';s.textContent=chars[Math.floor(Math.random()*chars.length)];s.style.left=(8+Math.random()*84)+'vw';s.style.top=(48+Math.random()*30)+'vh';document.body.appendChild(s);setTimeout(()=>s.remove(),1400);}}
document.addEventListener('keydown',e=>{if(!document.body.classList.contains('opened'))return;if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'&&index<chapters.length-1)go(index+1);if(e.key==='ArrowLeft'&&index>0)go(index-1);});
window.__kassuEnter=()=>playTurn('next');
render();playTurn('next');
})();
</script>
<script>
/* Background sparkles + petals (decoration only) */
(()=>{
 const fx=document.getElementById('fx');if(!fx)return;
 // petals: [left %, width px, fall seconds, sideways drift vw, start delay s]
 const petals=[[8,11,22,6,-3],[21,9,26,-8,-12],[34,13,20,10,-7],[47,10,28,-6,-18],[58,12,24,8,-1],[69,9,21,-10,-14],[78,14,27,7,-9],[90,10,23,-7,-20],[14,12,30,5,-24]];
 // sparkles: [left %, top %, size px, twinkle seconds, start delay s]
 const glints=[[12,13,16,4.2,-1],[31,9,11,5.1,-3],[63,7,14,3.8,-2],[88,12,20,4.8,-4],[7,37,12,5.5,-1.5],[94,42,15,4.1,-2.5],[19,71,11,4.9,-3.5],[82,64,17,4.4,-.5],[48,93,12,5.3,-2],[71,89,10,3.9,-4],[26,57,9,4.6,-1],[56,31,10,5.2,-3.2]];
 let h='';
 glints.forEach(g=>{h+=`<span class="glint" style="--x:${g[0]}%;--y:${g[1]}%;--s:${g[2]}px;--d:${g[3]}s;--dl:${g[4]}s"><i></i></span>`;});
 petals.forEach(p=>{h+=`<span class="petal" style="--x:${p[0]}%;--w:${p[1]}px;--d:${p[2]}s;--dx:${p[3]}vw;--dl:${p[4]}s"></span>`;});
 fx.innerHTML=h;
})();
/* Tap sparkles + tiny vibration on buttons (feature 5) */
(()=>{
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const cols=['#ffffff','#ffd0f0','#e6d4ff','#ffb8e6'];let last=0;
 document.addEventListener('click',e=>{
  if(!e.clientX&&!e.clientY)return;
  const t=e.target;if(t.closest&&t.closest('textarea'))return;
  const now=performance.now();if(now-last<90)return;last=now;
  let h='';const n=6;
  for(let i=0;i<n;i++){
   const a=(Math.PI*2*i/n)+Math.random()*.8,d=22+Math.random()*26,s=7+Math.random()*7;
   h+=`<span class="tapspark" style="left:${e.clientX}px;top:${e.clientY}px;--dx:${(Math.cos(a)*d).toFixed(1)}px;--dy:${(Math.sin(a)*d).toFixed(1)}px;--s:${s.toFixed(0)}px;--c:${cols[i%cols.length]}"><i></i></span>`;
  }
  const box=document.createElement('div');box.className='tapburst';box.innerHTML=h;document.body.appendChild(box);setTimeout(()=>box.remove(),800);
  if(t.closest&&t.closest('button')&&navigator.vibrate){try{navigator.vibrate(12)}catch(_){}}
 },{passive:true});
})();
</script>
<script>
/* Cover page + music */
(()=>{
 const cover=document.getElementById('cover'), nameEl=document.getElementById('coverName'), begin=document.getElementById('beginBtn'), snd=document.getElementById('soundBtn');
 'Kaashi'.split('').forEach((ch,i)=>{const sp=document.createElement('span');sp.textContent=ch;sp.style.setProperty('--i',i);nameEl.appendChild(sp);});
 const TARGET=1; /* music volume: 0 to 1 (1 = full, same as the phone's own volume) */
 const audio=new Audio('music.mp3');audio.loop=true;audio.preload='auto';audio.volume=0;
 let ok=true,muted=false,started=false,fadeT=null;
 audio.addEventListener('error',()=>{ok=false;snd.hidden=true;});
 function fadeTo(v,ms,done){
  clearInterval(fadeT);const from=audio.volume,t0=performance.now();
  fadeT=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);audio.volume=Math.max(0,Math.min(1,from+(v-from)*k));if(k>=1){clearInterval(fadeT);if(done)done();}},40);
 }
 /* Music starts on the very first page. Browsers only allow sound after a touch/click,
    so we try right away, and if blocked, start on the first tap anywhere on the cover. */
 const unlockEvents=['pointerup','touchend','click','keydown'];
 function unlock(){unlockEvents.forEach(ev=>document.removeEventListener(ev,tryPlay,true));}
 function tryPlay(){
  if(started||!ok||muted)return;
  const p=audio.play();
  const good=()=>{started=true;unlock();fadeTo(TARGET,1200);if(document.body.classList.contains('opened'))snd.hidden=false;};
  if(p&&p.then)p.then(good).catch(()=>{});else good();
 }
 unlockEvents.forEach(ev=>document.addEventListener(ev,tryPlay,true));
 tryPlay();
 begin.addEventListener('click',()=>{
  document.body.classList.add('opened');cover.classList.add('gone');
  const st=document.createElement('div');st.className='shoot-open';document.body.appendChild(st);setTimeout(()=>st.remove(),2000);
  if(window.__kassuEnter)setTimeout(window.__kassuEnter,500);
  tryPlay();
  snd.hidden=!ok;
 });
 snd.addEventListener('click',()=>{
  if(!started)return;
  muted=!muted;snd.textContent=muted?'🔇':'🔊';snd.setAttribute('aria-pressed',muted);
  if(muted)fadeTo(0,600,()=>audio.pause());else{audio.play().catch(()=>{});fadeTo(TARGET,1200);}
 });
 document.addEventListener('visibilitychange',()=>{
  if(!started||muted)return;
  if(document.hidden)audio.pause();else audio.play().catch(()=>{});
 });
})();
</script>
